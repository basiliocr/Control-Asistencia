{% extends "registro/base.html" %}
{% block titulo %}Eliminar administrador{% endblock %}
{% block contenido %}
<div class="cabecera">
    <h1>Eliminar administrador</h1>
</div>
<div class="tarjeta">
    <p style="margin-bottom:16px;line-height:1.5;">
        ¿Seguro que quieres eliminar al administrador
        <strong>{{ admin_user.username }}</strong>? Esta acción no se puede deshacer.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="form-botones">
            <button type="submit" class="btn btn-rojo">Eliminar</button>
            <a class="btn btn-gris" href="{% url 'admins_lista' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
