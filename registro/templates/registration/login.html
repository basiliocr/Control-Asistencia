<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f2f33, #123b40);
            color: #10221f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .tarjeta {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 40px 34px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 4px;
        }

        .sub {
            text-align: center;
            color: #5c7370;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #5c7370;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1.5px solid #d6e0de;
            border-radius: 11px;
            background: #fbfdfc;
            margin-bottom: 18px;
        }

        input:focus {
            outline: 2px solid #1f5fbf;
            border-color: #1f5fbf;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: #17803d;
            cursor: pointer;
        }

        button:hover {
            background: #146c34;
        }

        .error {
            background: #fdeaea;
            border-left: 4px solid #c0392b;
            color: #8f291f;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="tarjeta">
        <h1>Registro de Asistencia</h1>
        <p class="sub">Inicia sesión para marcar</p>

        {% if form.non_field_errors %}
        {% for e in form.non_field_errors %}
        <div class="error">{{ e }}</div>
        {% endfor %}
        {% elif form.errors %}
        <div class="error">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Usuario</label>
            <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>

            <label for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>

</html>
