<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Administración{% endblock %} · Asistencia</title>
    <style>
        :root {
            --verde: #17803d;
            --verde-h: #146c34;
            --azul: #1f5fbf;
            --teal: #0f2f33;
            --tenue: #5c7370;
            --borde: #dbe5e3;
            --rojo: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f1;
            color: #10221f;
            min-height: 100vh;
        }

        .barra {
            background: linear-gradient(160deg, #0f2f33, #123b40);
            color: #fff;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .barra .logo {
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
        }

        .barra nav {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .barra nav a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 8px;
        }

        .barra nav a:hover,
        .barra nav a.activo {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .barra .salir {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px;
        }

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .cabecera h1 {
            font-size: 22px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-verde {
            background: var(--verde);
            color: #fff;
        }

        .btn-verde:hover {
            background: var(--verde-h);
        }

        .btn-gris {
            background: #e3e9e7;
            color: #10221f;
        }

        .btn-rojo {
            background: var(--rojo);
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        th {
            background: var(--verde);
            color: #fff;
            font-size: 13px;
            text-align: left;
            padding: 12px 14px;
        }

        td {
            padding: 11px 14px;
            font-size: 14px;
            border-top: 1px solid #eef2f1;
        }

        tr:hover td {
            background: #f7faf9;
        }

        .acciones a {
            font-size: 13px;
            text-decoration: none;
            margin-right: 12px;
            font-weight: 600;
        }

        .a-editar {
            color: var(--azul);
        }

        .a-eliminar {
            color: var(--rojo);
        }

        .baja {
            color: var(--tenue);
            font-style: italic;
        }

        .tarjeta {
            background: #fff;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            max-width: 560px;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--tenue);
            margin-bottom: 6px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 11px 13px;
            font-size: 15px;
            border: 1.5px solid var(--borde);
            border-radius: 10px;
            background: #fbfdfc;
        }

        .campo input[type="checkbox"] {
            width: auto;
        }

        .campo small {
            display: block;
            color: var(--tenue);
            font-size: 12px;
            margin-top: 4px;
        }

        .campo .error {
            color: var(--rojo);
            font-size: 13px;
            margin-top: 4px;
        }

        .form-botones {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .mensajes {
            margin-bottom: 18px;
        }

        .msg {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid;
        }

        .msg.success {
            background: #e7f6ec;
            border-color: var(--verde);
            color: #0f5128;
        }

        .msg.info {
            background: #e6effb;
            border-color: var(--azul);
            color: #173d78;
        }

        .msg.error {
            background: #fdeaea;
            border-color: var(--rojo);
            color: #8f291f;
        }
    </style>
</head>

<body>
    <div class="barra">
        <a class="logo" href="{% url 'panel' %}">Asistencia · Administración</a>
        <nav>
            <a href="{% url 'panel' %}">Panel</a>
            <a href="{% url 'pasantes_lista' %}">Pasantes</a>
            <a href="{% url 'reportes' %}">Reportes</a>
            <a href="{% url 'admins_lista' %}">Admins</a>
        </nav>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="salir">Cerrar sesión</button>
        </form>
    </div>

    <div class="contenedor">
        {% if messages %}
        <div class="mensajes">
            {% for m in messages %}
            <div class="msg {{ m.tags }}">{{ m }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block contenido %}{% endblock %}
    </div>
</body>

</html>
