{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<div style="margin: 20px 0; max-width: 800px;">
    <h2 style="margin-bottom: 8px;">Ajustar el perímetro en el mapa</h2>
    <p style="color:#555; margin-bottom: 12px;">
        Haz clic en el mapa (o arrastra el punto) para colocar la institución.
        Cambia el valor de <strong>Radio metros</strong> de arriba para agrandar o achicar el círculo.
    </p>
    <div id="mapa-admin" style="height: 420px; border-radius: 8px; border: 1px solid #ccc;"></div>
    <button type="button" id="btn-mi-ubicacion" class="button" style="margin-top: 12px;">
        Usar mi ubicación actual
    </button>
</div>

<script>
    (function () {
        function init() {
            var latField = document.getElementById("id_latitud");
            var lngField = document.getElementById("id_longitud");
            var radioField = document.getElementById("id_radio_metros");
            if (!latField || !lngField || !radioField || typeof L === "undefined") {
                return setTimeout(init, 150);
            }

            var lat = parseFloat((latField.value || "-16.5").replace(",", ".")) || -16.5;
            var lng = parseFloat((lngField.value || "-68.15").replace(",", ".")) || -68.15;
            var radio = parseFloat(radioField.value || "100") || 100;

            var map = L.map("mapa-admin").setView([lat, lng], 16);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19, attribution: "© OpenStreetMap"
            }).addTo(map);

            var marcador = L.marker([lat, lng], { draggable: true }).addTo(map);
            var circulo = L.circle([lat, lng], {
                radius: radio, color: "#17803d", fillColor: "#17803d", fillOpacity: 0.15
            }).addTo(map);

            function mover(latlng) {
                marcador.setLatLng(latlng);
                circulo.setLatLng(latlng);
                latField.value = latlng.lat.toFixed(6);
                lngField.value = latlng.lng.toFixed(6);
            }

            map.on("click", function (e) { mover(e.latlng); });
            marcador.on("dragend", function () { mover(marcador.getLatLng()); });

            radioField.addEventListener("input", function () {
                var r = parseFloat(radioField.value || "0");
                if (!isNaN(r) && r > 0) circulo.setRadius(r);
            });

            var btn = document.getElementById("btn-mi-ubicacion");
            if (btn) {
                btn.addEventListener("click", function () {
                    if (!navigator.geolocation) return;
                    navigator.geolocation.getCurrentPosition(function (pos) {
                        var ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
                        map.setView(ll, 17);
                        mover(ll);
                    });
                });
            }

            setTimeout(function () { map.invalidateSize(); }, 250);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
</script>
{% endblock %}
