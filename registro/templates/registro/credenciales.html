<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciales QR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f1;
            color: #10221f;
            padding: 32px;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 24px;
        }

        .barra h1 {
            font-size: 20px;
        }

        .btn-imprimir {
            background: #17803d;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .grilla {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .credencial {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            border: 1px solid #dbe5e3;
        }

        .credencial img {
            width: 160px;
            height: 160px;
            image-rendering: pixelated;
            /* QR nítido al imprimir */
        }

        .nombre {
            margin-top: 12px;
            font-size: 16px;
            font-weight: 700;
        }

        .id {
            margin-top: 4px;
            font-size: 14px;
            color: #5c7370;
            letter-spacing: 1px;
        }

        .area {
            margin-top: 2px;
            font-size: 13px;
            color: #5c7370;
        }

        .vacio {
            text-align: center;
            color: #5c7370;
            margin-top: 40px;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .barra {
                display: none;
            }

            .credencial {
                box-shadow: none;
                border: 1px solid #ccc;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>
    <div class="barra">
        <h1>Credenciales de Asistencia</h1>
        <button class="btn-imprimir" onclick="window.print()">Imprimir</button>
    </div>

    {% if tarjetas %}
    <div class="grilla">
        {% for t in tarjetas %}
        <div class="credencial">
            <img src="data:image/png;base64,{{ t.qr }}" alt="QR de {{ t.pasante.nombre }}">
            <div class="nombre">{{ t.pasante.nombre }}</div>
            <div class="id">{{ t.pasante.identificador }}</div>
            <div class="area">{{ t.pasante.area }}</div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="vacio">No hay pasantes registrados todavía.</p>
    {% endif %}
</body>

</html>
